langcode: de
status: true
dependencies:
  config:
    - field.storage.node.field_location
    - field.storage.node.field_property_icon
    - field.storage.node.field_request_type
    - node.type.suchauftrag
  module:
    - node
    - user
id: search_requests
label: 'Suchaufträge'
module: views
description: 'Listet veröffentlichte Suchauftrag-Inhalte, filterbar über Kaufen/Mieten (art), Immobilienart (immobilienart) und Ort (ort) — die exposed-filter-Identifier, die das Suchformular in components/search-form.html.twig als Query-Parameter sendet. Wird von suchauftrag_theme über views_embed_view() eingebettet.'
tag: ''
base_table: node_field_data
base_field: nid
core: '10.0'
display:
  default:
    id: default
    display_title: Standard
    display_plugin: default
    position: 0
    display_options:
      title: Suchaufträge
      fields: {  }
      pager:
        type: some
        options:
          items_per_page: 6
          offset: 0
      access:
        type: perm
        options:
          perm: 'access content'
      cache:
        type: tag
        options: {  }
      query:
        type: views_query
        options:
          disable_sql_rewrite: false
          distinct: false
          replica: false
          query_comment: ''
          query_tags: {  }
      row:
        type: 'entity:node'
        options:
          relationship: none
          view_mode: teaser
      style:
        type: default
      filters:
        # ---- Fixed, non-exposed filters (always applied) ----
        status:
          id: status
          table: node_field_data
          field: status
          entity_type: node
          entity_field: status
          value: '1'
          plugin_id: boolean
          expose:
            operator: false
        type:
          id: type
          table: node_field_data
          field: type
          entity_type: node
          entity_field: type
          value:
            suchauftrag: suchauftrag
          plugin_id: bundle
          expose:
            operator: false

        # ---- Exposed filters — identifiers below MUST match the <input>/
        # <select> "name" attributes in
        # templates/components/search-form.html.twig exactly:
        #   art            <- Kaufen/Mieten radio tabs
        #   immobilienart  <- "Immobilienart" custom select
        #   ort            <- "Ort oder PLZ" text input (contains match)
        # Because our theme uses a fully custom-styled form (not Views'
        # auto-rendered exposed form), the identifiers are what connect
        # them: Views reads $_GET[identifier] on any page/block showing
        # this view, regardless of whose markup rendered the form.
        field_request_type_value:
          id: field_request_type_value
          table: node__field_request_type
          field: field_request_type_value
          relationship: none
          group_type: group
          admin_label: ''
          operator: '='
          value: ''
          group: 1
          exposed: true
          expose:
            operator_id: ''
            label: 'Gesuchsart'
            description: ''
            use_operator: false
            operator: field_request_type_value_op
            identifier: art
            required: false
            remember: false
            multiple: false
            remember_roles:
              authenticated: authenticated
            reduce: false
          is_grouped: false
          reduce_duplicates: false
          plugin_id: list_field
        field_property_icon_value:
          id: field_property_icon_value
          table: node__field_property_icon
          field: field_property_icon_value
          relationship: none
          group_type: group
          admin_label: ''
          operator: '='
          value: ''
          group: 1
          exposed: true
          expose:
            operator_id: ''
            label: 'Immobilienart'
            description: ''
            use_operator: false
            operator: field_property_icon_value_op
            identifier: immobilienart
            required: false
            remember: false
            multiple: false
            remember_roles:
              authenticated: authenticated
            reduce: false
          is_grouped: false
          reduce_duplicates: false
          plugin_id: list_field
        field_location_value:
          id: field_location_value
          table: node__field_location
          field: field_location_value
          relationship: none
          group_type: group
          admin_label: ''
          operator: contains
          value: ''
          group: 1
          exposed: true
          expose:
            operator_id: ''
            label: 'Ort oder PLZ'
            description: ''
            use_operator: false
            operator: field_location_value_op
            identifier: ort
            required: false
            remember: false
            multiple: false
            remember_roles:
              authenticated: authenticated
          is_grouped: false
          plugin_id: string
      sorts:
        created:
          id: created
          table: node_field_data
          field: created
          entity_type: node
          entity_field: created
          order: DESC
          plugin_id: date
      header: {  }
      footer: {  }
      empty:
        area_text_custom:
          id: area_text_custom
          table: views
          field: area_text_custom
          empty: true
          content: 'Aktuell wurden keine Suchaufträge gefunden. Bitte passen Sie Ihre Filter an oder schauen Sie später wieder vorbei.'
          plugin_id: text_custom
      relationships: {  }
      arguments: {  }
    cache_metadata:
      max-age: -1
      contexts:
        - 'languages:language_content'
        - 'languages:language_interface'
        - url
        - url.query_args
      tags:
        - 'config:node.type.suchauftrag'
        - node_list
  block_1:
    id: block_1
    display_title: 'Suchaufträge Block'
    display_plugin: block
    position: 1
    display_options:
      display_extenders: {  }
      block_description: 'Suchaufträge – Übersicht (Startseite)'
      block_category: 'Suchauftrag.de'
    cache_metadata:
      max-age: -1
      contexts:
        - 'languages:language_content'
        - 'languages:language_interface'
        - url
        - url.query_args
      tags:
        - 'config:node.type.suchauftrag'
        - node_list
