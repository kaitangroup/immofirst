id: offer_to_search_request
title: 'Angebot senden'
description: 'Machen Sie dem Suchenden ein passendes Angebot. Ihre Kontaktdaten werden erst nach Annahme sichtbar.'
categories: {  }
elements: |
  anrede:
    '#type': select
    '#title': 'Anrede'
    '#options':
      frau: Frau
      herr: Herr
      divers: Divers
    '#empty_option': 'Bitte wählen'
    '#required': true
    '#attributes':
      class:
        - select
        - input
  name:
    '#type': textfield
    '#title': 'Ihr Name'
    '#placeholder': 'z. B. Max Mustermann'
    '#required': true
    '#attributes':
      class:
        - input
  email:
    '#type': email
    '#title': 'E-Mail'
    '#placeholder': 'ihre@email.de'
    '#required': true
    '#attributes':
      class:
        - input
  telefon:
    '#type': tel
    '#title': 'Telefon (optional)'
    '#placeholder': 'z. B. 0171 1234567'
    '#attributes':
      class:
        - input
  angebot:
    '#type': textarea
    '#title': 'Ihr Angebot'
    '#placeholder': 'Beschreiben Sie kurz Ihre Immobilie (z. B. Lage, Größe, Ausstattung, Mietpreis)...'
    '#required': true
    '#attributes':
      class:
        - input
  dateien:
    '#type': managed_file
    '#title': 'Dateien hochladen (optional)'
    '#description': 'Dateien hier ablegen oder klicken (z. B. Exposé, Bilder, Grundriss (max. 5 MB)).'
    '#file_extensions': 'pdf doc docx jpg jpeg png'
    '#max_filesize': '5'
    '#attributes':
      class:
        - webform-upload-dropzone
  datenschutz_agb:
    '#type': checkbox
