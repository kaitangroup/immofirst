services:
  immofirst_geosearch.location_geocoder:
    class: Drupal\immofirst_geosearch\LocationGeocoder
    arguments:
      - '@geocoder'
      - '@entity_type.manager'
      - '@entity_field.manager'
      - '@geofield.wkt_generator'
      - '@cache.default'
      - '@datetime.time'
      - '@logger.channel.immofirst_geosearch'
  Drupal\immofirst_geosearch\LocationGeocoder: '@immofirst_geosearch.location_geocoder'

  immofirst_geosearch.proximity_filter:
    class: Drupal\immofirst_geosearch\SearchRequestProximityFilter
    arguments:
      - '@immofirst_geosearch.location_geocoder'
      - '@immofirst_geosearch.location_lookup'
      - '@page_cache_kill_switch'
      - '@config.factory'
      - '@plugin.manager.views.filter'

  immofirst_geosearch.backfill:
    class: Drupal\immofirst_geosearch\SearchRequestCoordinatesBackfill
    arguments:
      - '@immofirst_geosearch.location_geocoder'
      - '@entity_type.manager'
      - '@logger.channel.immofirst_geosearch'
  Drupal\immofirst_geosearch\SearchRequestCoordinatesBackfill: '@immofirst_geosearch.backfill'

  logger.channel.immofirst_geosearch:
    parent: logger.channel_base
    arguments: ['immofirst_geosearch']

  immofirst_geosearch.location_lookup:
    class: Drupal\immofirst_geosearch\GermanLocationLookup
    arguments:
      - '@immofirst_geosearch.location_geocoder'
      - '@logger.channel.immofirst_geosearch'
  Drupal\immofirst_geosearch\GermanLocationLookup: '@immofirst_geosearch.location_lookup'

  # HTTP client for Geocoder (injected into geocoder.http_adapter by
  # ImmofirstGeosearchServiceProvider): a slow Mapbox response must not hold
  # the autocomplete / form submit for core's default 30 s. Only geocoding
  # uses it; Drupal's global http_client is unchanged.
  immofirst_geosearch.geocoder_http_client:
    class: GuzzleHttp\Client
    factory: ['@http_client_factory', 'fromOptions']
    arguments:
      - { timeout: 5, connect_timeout: 3 }
