services:
  logger.channel.immofirst_api:
    parent: logger.channel_base
    arguments: ['immofirst_api']

  immofirst_api.token_manager:
    class: Drupal\immofirst_api\Service\ApiTokenManager
    arguments: ['@flood']
  Drupal\immofirst_api\Service\ApiTokenManager: '@immofirst_api.token_manager'

  immofirst_api.entity_manager:
    class: Drupal\immofirst_api\Service\EntityApiManager
    arguments:
      - '@entity_type.manager'
      - '@entity_type.bundle.info'
      - '@entity_field.manager'
      - '@lock'
      - '@stream_wrapper_manager'
      - '@datetime.time'
      - '@immofirst_api.token_manager'
      - '@logger.channel.immofirst_api'
  Drupal\immofirst_api\Service\EntityApiManager: '@immofirst_api.entity_manager'

  # Higher priority than cookie auth (0): on /api/v1/* with a Bearer header
  # this provider is always the one that applies.
  immofirst_api.authentication.token:
    class: Drupal\immofirst_api\Authentication\ApiTokenAuthenticationProvider
    arguments: ['@immofirst_api.token_manager', '@entity_type.manager', '@logger.channel.immofirst_api']
    tags:
      - { name: authentication_provider, provider_id: 'immofirst_api_token', priority: 200 }

  immofirst_api.access_check:
    class: Drupal\immofirst_api\Access\ApiAccessCheck
    tags:
      - { name: access_check, applies_to: _immofirst_api_access, needs_incoming_request: TRUE }

  immofirst_api.exception_subscriber:
    class: Drupal\immofirst_api\EventSubscriber\ApiExceptionSubscriber
    arguments: ['@logger.channel.immofirst_api']
    tags:
      - { name: event_subscriber }

  immofirst_api.page_cache_request_policy.disallow_api_requests:
    class: Drupal\immofirst_api\PageCache\DisallowApiRequests
    public: false
    tags:
      - { name: page_cache_request_policy }
