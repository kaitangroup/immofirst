# Laufzeit eines Suchauftrags in Monaten (4.1 "Gültig für", 4.2 Ablauf per Cron).
search_request_term_months: 3
# Maschinenname des E-Mail-Elements im Webform offer_to_search_request
# (Empfänger von 4.4, Reply-To der Weiterleitung an den Suchenden).
provider_email_element: email
brand_name: 'Suchauftrag.de'
tagline: 'Ihr Vorsprung am Immobilienmarkt'
footer_note: 'Diese E-Mail wurde automatisch versendet. Bitte antworten Sie nicht auf diese E-Mail.'
footer_company: 'Suchauftrag.de ist eine Plattform der PLAING GmbH'
# Relative Pfade (z. B. /impressum) oder absolute URLs. Leer = Link wird nicht angezeigt.
contact_url: ''
imprint_url: ''
privacy_url: ''
emails:
  search_request_created:
    subject: 'Ihr Suchauftrag wurde erfolgreich erstellt'
    heading: 'Ihr Suchauftrag wurde erfolgreich erstellt!'
    intro: "Vielen Dank! Wir haben Ihren Suchauftrag erhalten und für Sie aktiviert.\nWir benachrichtigen Sie, sobald ein passendes Angebot für Sie eingeht."
    summary_heading: 'Ihr Suchauftrag auf einen Blick'
    next_heading: 'Wie geht es jetzt weiter?'
    next_text: "Wir prüfen laufend neue Angebote für Sie.\nSobald ein passendes Angebot eingeht, informieren wir Sie per E-Mail.\nSie bleiben immer einen Schritt voraus – wir suchen, damit Sie finden."
    button_label: 'Zu meinem Suchauftrag'
    button_caption: 'Hier können Sie Ihren Suchauftrag jederzeit einsehen.'
    extra_heading: ''
    extra_text: ''
  search_request_terminated:
    subject: 'Ihr Suchauftrag ist beendet'
    heading: 'Ihr Suchauftrag ist beendet'
    intro: "Die Laufzeit Ihres Suchauftrags ist abgelaufen. Der Auftrag wurde automatisch beendet und aus Ihrer Auftragsliste entfernt.\nVielen Dank für Ihr Vertrauen in Suchauftrag.de."
    summary_heading: 'Ihr Suchauftrag im Überblick'
    next_heading: 'Wie geht es jetzt weiter?'
    next_text: 'Wenn Sie weiterhin auf der Suche sind, erstellen Sie einfach einen neuen Suchauftrag. So erhalten Sie wieder passende Angebote – automatisch und exklusiv.'
    button_label: 'Neuen Suchauftrag erstellen'
    button_caption: ''
    extra_heading: 'Nochmals vielen Dank!'
    extra_text: 'Wir freuen uns, Sie bei Ihrer Immobiliensuche unterstützt zu haben und wünschen Ihnen weiterhin viel Erfolg!'
  search_request_deleted:
    subject: 'Ihr Suchauftrag wurde gelöscht'
    heading: 'Ihr Suchauftrag wurde gelöscht'
    intro: "Ihr Suchauftrag wurde auf Ihren Wunsch erfolgreich gelöscht und aus unserer Auftragsliste entfernt.\nZu diesem Suchauftrag werden Ihnen keine weiteren Angebote mehr zugeordnet."
    summary_heading: 'Ihr Suchauftrag im Überblick'
    next_heading: 'Sie suchen zu einem späteren Zeitpunkt wieder eine Immobilie?'
    next_text: 'Erstellen Sie jederzeit einen neuen Suchauftrag – schnell, kostenlos und unverbindlich.'
    button_label: 'Neuen Suchauftrag erstellen'
    button_caption: ''
    extra_heading: ''
    extra_text: ''
  offer_sent:
    subject: 'Ihr Angebot wurde erfolgreich versendet'
    heading: 'Ihr Angebot wurde erfolgreich versendet!'
    intro: "Vielen Dank! Ihr Angebot wurde an den Suchenden weitergeleitet.\nSollte Ihr Angebot für den Suchenden interessant sein, wird er sich direkt mit Ihnen in Verbindung setzen."
    summary_heading: 'Ihr Angebot auf einen Blick'
    next_heading: 'Wie geht es jetzt weiter?'
    next_text: 'Wenn der Suchende Interesse an Ihrem Angebot hat, wird er sich persönlich bei Ihnen melden. Sie erhalten von uns keine weiteren Benachrichtigungen zu diesem Angebot.'
    button_label: 'Zu den Suchanfragen'
    button_caption: 'Sie möchten weitere passende Suchanfragen einsehen?'
    extra_heading: ''
    extra_text: ''
