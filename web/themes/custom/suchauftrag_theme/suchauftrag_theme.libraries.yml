      https://mistyrose-loris-414319.hostingersite.com/production-assets/v1/css/style.css: { type: external }
      https://mistyrose-loris-414319.hostingersite.com/production-assets/v1/css/components.css: { type: external }
      https://mistyrose-loris-414319.hostingersite.com/production-assets/v1/css/utilities.css: { type: external }
      https://mistyrose-loris-414319.hostingersite.com/production-assets/v1/css/responsive.css: { type: external }
  js:
    https://mistyrose-loris-414319.hostingersite.com/production-assets/v1/js/theme.js: { type: external }
  dependencies:
    - core/drupal
    - core/drupalSettings
    - core/once

fonts:
  css:
    theme:
      https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap: { type: external }

# NEW library — used only by templates/page--front.html.twig via
# {{ attach_library('suchauftrag_theme/search-ajax') }}. Connects the
# custom search form + "Weitere Suchaufträge laden" button to Drupal's
# existing Views AJAX (/views/ajax) for the search_requests view. Kept
# separate from "global" for the same reason as "auth"/"search-request-
# detail" below: no other page's JS payload changes. Needs
# drupalSettings (reads drupalSettings.views.ajax_path/ajaxViews,
# populated by the view itself since use_ajax: true is already set in
# views.view.search_requests.yml) and core/drupal (Drupal.behaviors /
# Drupal.attachBehaviors) — not "suchauftrag_theme/global", since it
# doesn't call anything theme.js defines.
search-ajax:
  js:
    https://mistyrose-loris-414319.hostingersite.com/production-assets/v1/js/search-ajax.js: { type: external }
  dependencies:
    - core/drupal
    - core/drupalSettings

# NEW library — used only by templates/page--front.html.twig via
# {{ attach_library('suchauftrag_theme/saved-searches') }}. Implements
# the "Nur gemerkte anzeigen" browser-only saved-search feature
# (bookmark toggle persistence + filtering already-loaded cards) using
# localStorage only — no Drupal field, view filter, or DB table.
# Depends on "global" because it toggles the existing
# .property-card__bookmark buttons that theme.js also binds a
# (purely visual, non-persisted) click handler to — see
# js/saved-searches.js's own header comment for how the two coexist.
saved-searches:
  js:
    https://mistyrose-loris-414319.hostingersite.com/production-assets/v1/js/saved-searches.js: { type: external }
  dependencies:
    - suchauftrag_theme/global

# NEW library — used only by templates/page--user-login.html.twig via
# {{ attach_library('suchauftrag_theme/auth') }}. Kept separate from
# "global" so no other page's CSS payload changes.
auth:
  css:
    theme:
      https://mistyrose-loris-414319.hostingersite.com/production-assets/v1/css/auth.css: { type: external }
  dependencies:
    - suchauftrag_theme/global

# NEW library — used only by templates/node--search-request.html.twig
# via {{ attach_library('suchauftrag_theme/search-request-detail') }}.
# Same reasoning as "auth" above: kept separate from "global" so no
# other page's CSS payload changes.
search-request-detail:
  css:
    theme:
      https://mistyrose-loris-414319.hostingersite.com/production-assets/v1/css/search-request-detail.css: { type: external }
      https://mistyrose-loris-414319.hostingersite.com/production-assets/v1/css/how-it-works.css: { type: external }
  dependencies:
    - suchauftrag_theme/global

# NEW library — used only by templates/webform--offer-to-search-request.html.twig
# via {{ attach_library('suchauftrag_theme/offer-webform') }}, called from
# inside that template itself (not from node--search-request.html.twig,
# which stays untouched). Depends explicitly on "search-request-detail"
# (not just "global") so its CSS is guaranteed to load LAST on this page,
# letting the few property-only overrides in offer-webform.css (card
# radius) win on normal specificity, with no !important needed.
offer-webform:
  css:
    theme:
      https://mistyrose-loris-414319.hostingersite.com/production-assets/v1/css/offer-webform.css: { type: external }
  js:
    https://mistyrose-loris-414319.hostingersite.com/production-assets/v1/js/offer-webform.js: { type: external }
  dependencies:
    - suchauftrag_theme/search-request-detail
    - core/drupal