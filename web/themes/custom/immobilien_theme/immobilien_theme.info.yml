name: 'Immobilien Theme'
type: theme
description: 'Premium real-estate landing theme with hero, search form, feature cards and animated wave backgrounds. Built for Drupal 11.'
package: Custom
core_version_requirement: ^11
base theme: false
screenshot: screenshot.png
logo: logo/logo.svg

libraries:
  - immobilien_theme/global
  - immobilien_theme/homepage

libraries-override:
  core/normalize: false

regions:
  header: 'Header'
  primary_menu: 'Primary menu'
  secondary_menu: 'Secondary menu'
  breadcrumb: 'Breadcrumb'
  highlighted: 'Highlighted'
  help: 'Help'
  content_top: 'Content top'
  content: 'Content'
  content_bottom: 'Content bottom'
  sidebar_first: 'Sidebar first'
  sidebar_second: 'Sidebar second'
  footer_top: 'Footer top'
  footer: 'Footer'
